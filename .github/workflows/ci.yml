name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Install Cap'n Proto
        run: choco install capnproto --version=1.3.0 -y --no-progress

      - name: Build
        run: cargo build --all-targets

      - name: Test
        run: cargo test

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Install Cap'n Proto
        run: sudo apt-get update && sudo apt-get install -y capnproto

      - name: Load vsock loopback
        run: sudo modprobe vsock_loopback || echo "vsock_loopback is not available; the vsock tests will skip"

      - name: Test
        run: cargo test

      - name: Check fuzz targets
        run: cargo check --manifest-path fuzz/Cargo.toml

      - name: Check benches
        run: cargo check --manifest-path benches/Cargo.toml --benches

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Install Cap'n Proto
        run: brew install capnp

      - name: Check
        run: cargo check --all-targets
